[package]
name = "mytermin"
version = "0.1.1"
description = "Multi-Terminal Workspace for Windows"
authors = ["MyTermin Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
crossbeam-channel = "0.5"
sysinfo = "0.33"
arboard = "3"
clipboard-win = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"

[[bin]]
name = "mytermin"
path = "src/main.rs"
